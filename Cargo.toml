[workspace]
resolver = "2"
members = ["crates/ergotop-core", "crates/ergotop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
blake2 = "0.10"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
dirs = "5"
hex = "0.4"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
wiremock = "0.6"
criterion = "0.8"
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
futures = "0.3"
insta = "1"
ratatui = "0.30"
tracing-subscriber = "0.3"
webbrowser = "1"
